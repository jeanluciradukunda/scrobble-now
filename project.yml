name: ScrobbleNow
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  ScrobbleNow:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - ScrobbleNowTests
    sources:
      - path: ScrobbleNow
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.ScrobbleNow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Scrobble Now reads the current tab in Safari and Chrome, and the artwork in Spotify, to scrobble what is playing."
        INFOPLIST_KEY_CFBundleDisplayName: "Scrobble Now"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: "Scrobble Now"
        CODE_SIGN_ENTITLEMENTS: ScrobbleNow/Resources/ScrobbleNow.entitlements
        COMBINE_HIDPI_IMAGES: YES
        DEVELOPMENT_TEAM: YNB3ADRMFC
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  ScrobbleNowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ScrobbleNowTests
    dependencies:
      - target: ScrobbleNow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.ScrobbleNowTests
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Scrobble Now.app/Contents/MacOS/Scrobble Now"
        BUNDLE_LOADER: "$(TEST_HOST)"

  ScrobbleNowiOS:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: ScrobbleNow
        excludes:
          - "App/ScrobbleNowApp.swift"
          - "Services/MediaRemoteBridge.swift"
          - "Services/MetricsService.swift"
          - "**/.DS_Store"
      - path: ScrobbleNowiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.ScrobbleNow.ios
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: "Scrobble Now"
        DEVELOPMENT_TEAM: YNB3ADRMFC
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "Scrobble Now"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "Scrobble Now reads what is playing in Apple Music to scrobble it to Last.fm."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Scrobble Now saves collages you share to your photo library."
